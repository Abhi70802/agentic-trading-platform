[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --cov=. --cov-branch --cov-report=term-missing
markers =
	unit: fast isolated domain and calculation tests
	component: tests of a service or adapter with collaborators controlled
	integration: tests across HTTP, persistence, or provider boundaries using local doubles
	event_driven: tests of callback, event ordering, and stream behavior
	e2e: offline end-to-end workflow tests using fakes and temporary state
	replay: deterministic paper replay, simulation, and backtest tests
	chaos: injected failures, stale data, and fail-closed behavior
	performance: bounded offline throughput and load smoke tests